<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chroniques de Cayo Perico</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #f4ead3;
    --paper-dark: #ead8b3;
    --ink: #24170f;
    --ink-light: #5b4631;
    --ink-faint: #8e7559;
    --border: #baa07a;
    --gold: #a6804e;
    --rust: #8b4f34;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IM Fell English', Georgia, serif;
  }

  #scene {
    perspective: 2000px;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #book-wrapper {
    position: relative;
    width: 860px;
    height: 620px;
    transform-style: preserve-3d;
  }

  #cover-container {
    position: absolute;
    width: 430px;
    height: 620px;
    left: 215px;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 100;
    cursor: pointer;
    transition: filter 0.3s;
  }

  #cover-container:hover { filter: brightness(1.05); }

  .cover-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 5px 5px 2px;
    overflow: hidden;
  }

  .cover-front {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
  }

  .cover-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .cover-title-art {
    font-family: 'IM Fell English SC', serif;
    color: #d8c39a;
    text-align: center;
    line-height: 1.2;
  }

  .cover-title-art .big {
    font-size: 34px;
    letter-spacing: 0.08em;
    display: block;
  }

  .cover-title-art .small {
    font-size: 13px;
    letter-spacing: 0.32em;
    color: #a6804e;
    display: block;
    margin-top: 14px;
  }

  .cover-rule {
    width: 150px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #a6804e, transparent);
    margin: 22px auto;
  }

  .cover-sub {
    font-size: 12px;
    color: #8e7559;
    text-align: center;
    letter-spacing: 0.06em;
    line-height: 1.6;
  }

  .cover-back {
    transform: rotateY(180deg);
    background: var(--paper);
    border: 1px solid #8b6c3f;
    box-shadow: inset 8px 0 24px rgba(0,0,0,0.10);
  }

  #cover-back-content { width: 100%; height: 100%; }

  .cover-spine {
    position: absolute;
    left: -14px;
    top: 0;
    width: 14px;
    height: 620px;
    background: linear-gradient(90deg, #74552f, #a27d4c, #6d4f2c);
    border-left: 1px solid #644726;
    border-right: 1px solid #ccb58f;
    transform: rotateY(-90deg) translateX(-7px);
    transform-origin: right center;
  }

  .cover-click-hint {
    position: absolute;
    bottom: -34px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IM Fell English SC', serif;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 2px;
    animation: pulse-hint 2.5s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes pulse-hint {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.9; }
  }

  #pages-stack {
    position: absolute;
    left: 50%;
    top: 0;
    width: 430px;
    height: 620px;
    background: linear-gradient(90deg, #d9c9a5, #f4ead3 10%, #ecdebf 90%, #ccb78d);
    border-radius: 0 5px 5px 0;
    box-shadow: 6px 4px 20px rgba(0,0,0,0.35);
    overflow: hidden;
    display: none;
  }

  #left-page {
    position: absolute;
    left: 0;
    top: 0;
    width: 430px;
    height: 620px;
    background: var(--paper);
    border-right: 1px solid var(--border);
    overflow: hidden;
    box-shadow: inset -6px 0 12px rgba(0,0,0,0.04);
    display: none;
  }

  #flip-container {
    position: absolute;
    left: 50%;
    top: 0;
    width: 430px;
    height: 620px;
    transform-origin: left center;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
    z-index: 10;
    pointer-events: none;
    display: none;
  }

  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    overflow: hidden;
  }

  #flip-front { background: var(--paper); box-shadow: inset -4px 0 12px rgba(0,0,0,0.05); }
  #flip-back  { background: var(--paper); transform: rotateY(180deg); box-shadow: inset 4px 0 12px rgba(0,0,0,0.05); }

  .page-content {
    width: 100%;
    height: 100%;
    padding: 24px 28px 18px;
    position: relative;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.01)),
      var(--paper);
    overflow: hidden;
  }

  .page-num {
    position: absolute;
    bottom: 10px;
    font-family: 'IM Fell English SC', serif;
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .page-num.left { left: 26px; }
  .page-num.right { right: 26px; }

  .sec-title {
    font-family: 'IM Fell English SC', serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink);
    text-align: center;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .body-text {
    font-size: 13px;
    line-height: 1.78;
    color: var(--ink);
    margin-bottom: 11px;
    text-align: justify;
    hyphens: auto;
  }

  .body-text + .body-text { text-indent: 1.2em; }

  .drop-cap::first-letter {
    font-family: 'IM Fell English SC', serif;
    font-size: 3.1rem;
    float: left;
    line-height: 0.76;
    margin: 0.06rem 0.4rem 0 0;
    color: var(--ink-light);
  }

  .marginal {
    font-size: 11px;
    color: var(--ink-light);
    margin: 8px 0 10px;
    padding: 8px 10px 8px 12px;
    border-left: 2px solid #c8a878;
    background: rgba(0,0,0,0.025);
    line-height: 1.58;
    font-style: italic;
  }

  .warning {
    font-style: italic;
    color: var(--rust);
    padding: 8px 12px;
    border-left: 2px solid var(--rust);
    margin: 8px 0 10px;
    font-size: 11.6px;
    line-height: 1.62;
    background: rgba(139,79,52,0.04);
  }

  .dream-block {
    background: rgba(40,32,60,0.05);
    border: 1px solid #9a8bb0;
    border-left: 2px solid #6c5b8c;
    padding: 11px 14px;
    margin: 10px 0 12px;
    font-style: italic;
    font-size: 12px;
    line-height: 1.7;
    color: #3a2f47;
  }

  .dream-block .dream-label {
    display: block;
    font-family: 'IM Fell English SC', serif;
    font-style: normal;
    font-size: 9px;
    letter-spacing: 0.16em;
    color: #6c5b8c;
    margin-bottom: 5px;
  }

  .torn {
    background: #ead8b3;
    border: 1px solid var(--border);
    border-top: 2px solid var(--border);
    padding: 11px 13px 13px;
    margin: 10px 0 12px;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.64;
    font-style: italic;
  }

  .title-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex: 1;
  }

  .cv-title {
    font-family: 'IM Fell English SC', serif;
    color: var(--ink);
    line-height: 1.15;
  }

  .cv-rule {
    width: 160px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 10px auto;
  }

  .cv-subtitle {
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-faint);
  }

  .cv-author {
    font-family: 'IM Fell English SC', serif;
    font-size: 16px;
    color: var(--ink-light);
    margin-top: 8px;
  }

  .cv-origin {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .toc-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
    font-size: 11.2px;
    color: var(--ink);
  }

  .toc-page {
    color: var(--gold);
    font-family: 'IM Fell English SC', serif;
  }

  .letter {
    font-size: 13px;
    line-height: 1.78;
  }

  .pf {
    margin-top: auto;
    padding-top: 7px;
    border-top: 1px solid rgba(166,128,78,0.28);
    font-family: 'IM Fell English SC', serif;
    font-size: 8px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 0.11em;
  }

  #nav-prev, #nav-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(26,16,8,0.25);
    border: 1px solid #9a7a50;
    color: #c4ae88;
    width: 42px;
    height: 70px;
    cursor: pointer;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    z-index: 1000;
    font-family: serif;
    user-select: none;
  }

  #nav-prev { left: calc(50% - 450px); border-radius: 6px 0 0 6px; }
  #nav-next { right: calc(50% - 450px); border-radius: 0 6px 6px 0; }
  #nav-prev:hover, #nav-next:hover { background: rgba(26,16,8,0.55); color: #f5edd8; }
  #nav-prev.hidden, #nav-next.hidden { opacity: 0; pointer-events: none; }

  #page-indicator {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IM Fell English SC', serif;
    font-size: 10px;
    color: #9a7a50;
    letter-spacing: 2px;
    white-space: nowrap;
    z-index: 1000;
  }

  #cover-container.opening {
    animation: cover-open 1.35s cubic-bezier(0.46, 0.03, 0.30, 1) forwards;
    pointer-events: none;
  }

  @keyframes cover-open {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-178deg); }
  }

  #cover-container.opened {
    transform: rotateY(-178deg);
    pointer-events: none;
  }

  .cover-front { transition: box-shadow 0.4s; }

  #cover-container.opening .cover-front {
    box-shadow: 14px 0 40px rgba(0,0,0,0.55), inset -3px 0 10px rgba(255,255,255,0.06);
  }

  #pages-stack.revealing, #flip-container.revealing {
    animation: half-reveal 0.5s ease-out forwards;
  }

  @keyframes half-reveal {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="scene">
  <div id="book-wrapper">
    <div id="left-page"><div class="page-content" id="left-content"></div></div>
    <div id="pages-stack"><div id="pages-stack-content" class="page-content"></div></div>
    <div id="flip-container">
      <div class="flip-face" id="flip-front"><div class="page-content" id="flip-front-content"></div></div>
      <div class="flip-face" id="flip-back"><div class="page-content" id="flip-back-content"></div></div>
    </div>

    <div id="cover-container">
      <div class="cover-face cover-front">
        <img src="cayo-cover.png" alt="Couverture du livre Chroniques de Cayo Perico">
      </div>
      <div class="cover-face cover-back">
        <div class="page-content" id="cover-back-content"></div>
      </div>
      <div class="cover-spine"></div>
      <div class="cover-click-hint">Ouvrir le livre</div>
    </div>
  </div>
</div>

<button id="nav-prev" class="hidden" onclick="flipPrev()">&#8249;</button>
<button id="nav-next" class="hidden" onclick="flipNext()">&#8250;</button>
<div id="page-indicator"></div>

<script>
const spreads = [
  {
    left: `<div class="sec-title">Presentation</div>
<div class="title-page">
  <div class="cv-title" style="font-size:26px;margin-bottom:8px">Chroniques de<br>Cayo Perico</div>
  <div class="cv-rule"></div>
  <div class="cv-subtitle" style="margin-top:8px">Le recit d'une ile, de ses familles et de ses reves</div>
  <div style="margin:18px 0 10px;text-align:center">
    <svg width="160" height="104" viewBox="0 0 230 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="#9A7A50" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 104 Q60 86 115 92 Q170 98 216 104" stroke-width="1.4" opacity="0.7"/>
        <path d="M70 92 L96 54 L120 80 L150 40 L176 92 Z" stroke-width="2"/>
        <path d="M150 40 L150 22" stroke-width="1.6"/>
        <path d="M150 22 L162 30 L150 33 Z" stroke-width="1.6"/>
        <circle cx="46" cy="74" r="7" stroke-width="1.2"/>
        <path d="M46 67 L46 50 M40 56 L46 50 L52 56" stroke-width="1.2"/>
        <path d="M22 116 Q40 110 60 116 M150 116 Q172 110 196 116" stroke-width="1.1" opacity="0.55"/>
      </g>
    </svg>
  </div>
  <div class="cv-author">Archives des Mendoza</div>
  <div class="cv-origin">edition de l'ile</div>
</div>
<div class="page-num left">i</div>`,
    right: `<div class="sec-title">Contenu</div>
<div style="margin-bottom:14px">
  <div class="toc-row"><span>I. L'ile et ses pierres</span><span class="toc-page">1</span></div>
  <div class="toc-row"><span>II. Les Mendoza et l'homme Nocturn</span><span class="toc-page">2</span></div>
  <div class="toc-row"><span>III. L'epicerie des Tamales</span><span class="toc-page">3</span></div>
  <div class="toc-row"><span>IV. Le village et ses gens</span><span class="toc-page">4</span></div>
  <div class="toc-row"><span>V. Le casino sur la pointe</span><span class="toc-page">5</span></div>
  <div class="toc-row"><span>VI. La nuit des trois feux</span><span class="toc-page">6</span></div>
  <div class="toc-row"><span>VII. Le reve et la porte</span><span class="toc-page">7</span></div>
</div>
<p class="body-text drop-cap">Il y a des iles qu'on traverse et des iles qui vous gardent. Cayo Perico est de la seconde sorte. Ce petit livre n'est pas un guide : c'est le recit qu'on se passe le soir, devant l'epicerie, quand la mer est noire et que personne n'a envie de rentrer dormir tout de suite.</p>
<p class="body-text">On l'a ecrit court, parce que les vraies histoires d'ile tiennent toujours en peu de pages. Le reste, ce sont les nuits qui s'en chargent.</p>
<div class="page-num right">i</div>`
  },
  {
    left: `<div class="sec-title">I. L'ile et ses pierres</div>
<p class="body-text drop-cap">Longtemps, Cayo Perico n'a appartenu qu'aux perroquets verts et aux pecheurs de passage. On s'y abritait des tempetes, on buvait a la source du centre dont l'eau, disait-on, avait un drole de gout, un gout de sommeil. Puis on repartait. Personne ne restait. La jungle etait trop epaisse, et quelque chose, sous les arbres, decourageait qu'on s'installe.</p>
<p class="body-text">Ce quelque chose, c'etaient les pierres. Au coeur de l'ile, sous les racines, dorment des blocs tailles et graves de figures usees. Un vieil avant-poste maya, disent les savants venus une fois et jamais revenus. L'ancien lieu, disent les gens d'ici, en baissant la voix et en changeant de sujet.</p>
<p class="body-text">Les figures racontent toujours la meme chose : un gardien endormi sous l'ile, une porte que les astres ouvrent et ferment, et un avertissement grave dans la pierre. Celui qui batit sur le gardien partagera son sommeil. Pendant des siecles, personne n'a bati. L'ile attendait. Elle a su attendre longtemps.</p>
<p class="body-text">Et puis sont venus ceux qui ne croyaient ni aux perroquets ni aux pierres. Ceux qui voyaient, dans ce point vert au milieu du bleu, non pas un avertissement, mais une occasion.</p>
<div class="page-num left">1</div>`,
    right: `<div class="sec-title">II. Les Mendoza et l'homme Nocturn</div>
<p class="body-text drop-cap">La famille Mendoza a rachete l'ile parcelle par parcelle, jusqu'a la derniere. Vieille lignee de marchands des Caraibes, ils voulaient une terre a eux seuls, sans voisin, sans frontiere a partager. Le patriarche, Juan Mendoza, en a fait une forteresse : une piste percee dans la jungle, des tours sur les plages, des cameras dans les arbres, des gardes le long du sable.</p>
<p class="body-text">Mais les Mendoza n'ont pas pense l'ile. Ils l'ont payee. Celui qui l'a pensee, c'est un homme dont personne ne connait le vrai visage, et que le village appelle Nocturn. Il travaille avec les Mendoza, jamais pour eux : eux tiennent le titre de propriete, lui tient la logique du lieu. Et sur une ile, c'est la logique qui commande.</p>
<p class="body-text">C'est Nocturn qui a trace la piste, choisi l'angle des cameras, creuse les tunnels sous la jungle. C'est lui qui a decide ou les murs tomberaient. Les gardes executent, les Mendoza financent, mais rien ne bouge a Cayo Perico sans que Nocturn l'ait dessine d'abord. Le village l'appelle le createur, moitie par respect, moitie par gene.</p>
<p class="body-text">Car personne n'a jamais pu dire ce qu'il cherchait. Une cachette, pensent les uns. Un piege, pensent les autres. Et les plus vieux, ceux qui connaissent les pierres, murmurent autre chose : que Nocturn n'a pas bati une forteresse, mais un couvercle. Et qu'un homme qui pose un couvercle sait toujours, au fond, ce qu'il y a dessous.</p>
<div class="page-num right">2</div>`
  },
  {
    left: `<div class="sec-title">III. L'epicerie des Tamales</div>
<p class="body-text drop-cap">Si les Mendoza tiennent l'ile par le haut, c'est la famille Tamales qui la tient par le milieu. Leur epicerie, une batisse basse aux volets bleus posee entre la chapelle et le ponton, est l'unique commerce de Cayo Perico. On y vient pour le riz, l'huile, les piles, le fil de peche. On y reste pour les nouvelles.</p>
<p class="body-text">Trois generations de Tamales ont pese le cafe derriere ce comptoir. Le grand-pere a ouvert l'echoppe du temps des premiers Mendoza ; aujourd'hui ce sont les enfants qui notent les ardoises dans un grand cahier graisseux. Ce cahier, sans qu'on l'ait voulu, est devenu la memoire de l'ile : entre deux dettes de farine, on y lit la date d'une tempete, le nom d'un bateau pirate, la nuit ou la moitie du village a fait le meme reve.</p>
<p class="body-text">Les Tamales ne sont ni proprietaires ni employes. Ils sont indispensables, et cela leur a donne une liberte rare. Quand un garde se dispute avec un pecheur, quand un etranger debarque et qu'on ne sait qu'en faire, c'est au comptoir des Tamales que la chose se regle, a voix basse, entre deux clients. Ils gardent aussi, sous le plancher, ce que le village leur confie : des papiers, un peu d'argent, des objets qu'on ne veut pas garder chez soi. Ils n'ont jamais trahi un depot.</p>
<p class="body-text">On dit ici que pour comprendre Cayo Perico, il ne faut parler ni aux gardes ni aux Mendoza. Il faut s'asseoir sur le banc devant l'epicerie, commander un cafe, et ecouter ce que les Tamales laissent dire.</p>
<div class="page-num left">3</div>`,
    right: `<div class="sec-title">IV. Le village et ses gens</div>
<p class="body-text drop-cap">Le village tient en une trentaine de feux, serres autour de l'epicerie. Il y a Lucia, la cuisiniere, qui nourrit autant les ouvriers que les rumeurs. Il y a le vieux Esteban, ancien plongeur, qui connait chaque recif et chaque epave, et qui jure que la mer autour de l'ile a deux fonds : celui qu'on voit, et celui qu'on reve. Il y a Marisol, l'institutrice de fortune, qui apprend a lire aux enfants sur de vieux registres Mendoza.</p>
<p class="body-text">Et puis il y a les gardes : de jeunes hommes payes pour surveiller, qui dorment dans les baraques de la pointe et descendent le soir boire a l'epicerie. Entre eux et le village, c'est de la mefiance polie et de petits arrangements. Tout le monde partage la meme ile et le meme ciel, mais pas la meme histoire.</p>
<p class="body-text">Le village a appris a vivre de cote. Il ne se revolte pas, il s'arrange : il connait les horaires des patrouilles, les angles morts des cameras, les sentiers que les gardes ne prennent jamais. Ce n'est pas de la rebellion, c'est de la survie, transmise comme une recette de cuisine. Les enfants l'apprennent tot : on peut tout voir, a condition de ne rien dire devant les bonnes personnes.</p>
<p class="body-text">C'est ce village-la, attentif et silencieux, qui a vu monter le casino, qui a subi les bateaux venus de la mer, et qui partage, sans jamais l'avouer aux Mendoza, les memes reves au creux de la nuit.</p>
<div class="page-num right">4</div>`
  },
  {
    left: `<div class="sec-title">V. Le casino sur la pointe</div>
<p class="body-text drop-cap">L'idee du casino est venue d'en haut, du domaine, avec la double signature des Mendoza et de Nocturn. Juan Mendoza voulait que l'ile rapporte sans qu'on voie d'ou venait l'argent. Nocturn a propose un casino. Et il l'a voulu, a la surprise de tous, non pas pres du ponton, au chaud, mais tout au bout de l'ile, sur la pointe rocheuse battue par le vent.</p>
<p class="body-text">On a compris plus tard que ce n'etait pas un caprice. Une seule route d'acces, c'est un seul point a surveiller, un seul point a defendre, un seul point a couper. Sous le casino, Nocturn a fait courir des couloirs et des caches. Le batiment n'est pas qu'une salle de jeu : c'est un piege concu pour se refermer.</p>
<p class="body-text">Quand le casino a ouvert, l'ile a change de nature. Cayo Perico n'etait plus une cachette : c'etait une adresse. Quelques nuits par mois, l'horizon se peuple de feux de position, et tout le monde sait que parmi ces bateaux, certains ne viennent pas jouer. L'epicerie Tamales, ces nuits-la, triple son chiffre, et le cahier des ardoises se remplit de noms qu'on n'avait jamais vus.</p>
<p class="body-text">En feuilletant ce cahier, on remarque une chose. Les nuits de casino sont notees a part, d'une petite croix. Et ces nuits-la coincident souvent avec deux autres : les bateaux venus de la mer, et les reves qui reviennent. Comme si le bruit du casino, en haut, reveillait quelque chose, en bas.</p>
<div class="page-num left">5</div>`,
    right: `<div class="sec-title">VI. La nuit des trois feux</div>
<p class="body-text drop-cap">Cayo Perico a toujours connu les pirates. D'abord des ecumeurs, puis des contrebandiers, puis des bandes mieux armees qui avaient entendu parler du casino et de ce qu'on disait y garder. Leurs attaques suivaient toujours le meme scenario : des bateaux rapides a la tombee de la nuit, profitant d'une tempete ou d'une nuit de jeu pour se fondre dans le trafic.</p>
<p class="body-text">La plus grande de ces attaques, les anciens l'appellent la nuit des trois feux. Trois navires, des dizaines d'hommes, le ponton en flammes. Les gardes de Mendoza ont repondu depuis les tours ; le village, lui, a ferme les volets. Et c'est l'epicerie Tamales qui a servi de refuge : la famille a ouvert l'arriere-boutique, cache les enfants sous le plancher, et tenu la porte jusqu'a l'aube.</p>
<p class="body-text">Les pirates ont fini par reculer. Mais cette nuit-la, l'ile a compris quelque chose : les murs de Nocturn et les fusils des Mendoza protegeaient le domaine, pas le village. Le village n'avait que les Tamales, leur arriere-boutique et leur cahier. Depuis, une lampe a la fenetre de l'epicerie, allumee puis eteinte trois fois, veut dire bateau inconnu.</p>
<p class="body-text">Il y a, dans le cahier des ardoises, une page que la famille ne montre pas volontiers. On y a note, attaque apres attaque, les noms des disparus du village. Ce ne sont pas beaucoup de noms. Mais ici, ou tout le monde se connait, chaque nom est une part de l'ile qui manque.</p>
<div class="page-num right">6</div>`
  },
  {
    left: `<div class="sec-title">VII. Le reve et la porte</div>
<p class="body-text drop-cap">Depuis que Nocturn a perce ses tunnels et que les Mendoza ont dresse leurs murs, les nuits de Cayo Perico ont change. Ceux qui dorment trop longtemps sur l'ile font des reves. Pas n'importe lesquels. Toujours le meme. On y descend : sous la jungle, sous le casino, sous la mer. On marche dans un couloir de pierre plus ancien que ceux de Nocturn. Et au bout, il y a une porte, couverte des memes figures que les blocs graves.</p>
<div class="dream-block"><span class="dream-label">Cahier des ardoises &mdash; page tachee</span>"Cette nuit encore le couloir. Lucia l'a vu. Esteban l'a vu. Le garde du ponton l'a vu et il n'est pas d'ici. La porte etait entrouverte. Derriere, ce n'etait pas noir. C'etait plein."</div>
<p class="body-text">Les anciens disent que ce ne sont pas des cauchemars, mais des messages. L'ile, reveillee par les travaux, se sert du sommeil des hommes comme les Tamales se servent de leur cahier : pour noter, pour transmettre, pour avertir. Le recit maya l'avait grave : le gardien ne parle que la nuit, et seulement a ceux qui dorment sur lui.</p>
<p class="body-text">Ce qui inquiete le village, ce n'est pas le reve. C'est qu'il avance. Au debut, seuls les anciens descendaient le couloir. Puis les pecheurs. Puis les enfants. Et la derniere page du cahier note, pour la premiere fois, un garde de Mendoza venu, blanc, demander aux Tamales s'il etait normal de rever d'une porte qu'on n'a jamais vue.</p>
<div class="torn">Recopie du grand cahier, a la demande de la famille. "Si vous dormez ici, ne descendez pas le couloir jusqu'au bout. Personne n'a note ce qu'il y avait apres la porte ouverte. Ceux qui sont alles voir n'ont rien ecrit en rentrant. Et certains ne sont pas rentres ecrire du tout."</div>
<div class="page-num left">7</div>`,
    right: `<div class="sec-title" style="font-style:italic">Pour finir</div>
<div class="letter">
  <p style="margin-bottom:10px">Voila l'histoire de Cayo Perico, telle qu'on se la passe le soir. Une ile a trois etages. En haut, les Mendoza, leurs gardes, leur casino, leur piste. Au milieu, le village et les Tamales, et ce cahier qui tient lieu de memoire. Et tout en bas, l'ancien lieu, la pierre gravee, le couloir des reves.</p>
  <p style="margin-bottom:10px">Ces trois etages ne s'ignorent pas. Le casino a reveille la pierre. La pierre envoie les reves. Les reves passent par le village et finissent chez les Tamales. Les Mendoza, qui croient tenir l'ile par le haut, sont peut-etre les seuls a ne pas voir ce qui monte du bas.</p>
  <p>Reste la question que le cahier repose chaque hiver, un peu plus bas dans la marge : si la porte continue de s'ouvrir, qui, du gardien endormi ou des hommes qui dorment sur lui, finira par traverser le premier. L'ile, elle, ne dort jamais tout a fait. Elle attend. Elle a toujours su attendre.</p>
</div>
<div class="pf">Chroniques de Cayo Perico &middot; fin &middot; cahier des Tamales</div>`
  }
];

let currentSpread = 0;
let isOpen = false;
let isAnimating = false;
const TOTAL_SPREADS = spreads.length;

const cover = document.getElementById('cover-container');
const flipContainer = document.getElementById('flip-container');
const flipFront = document.getElementById('flip-front-content');
const flipBack = document.getElementById('flip-back-content');
const leftContent = document.getElementById('left-content');
const navPrev = document.getElementById('nav-prev');
const navNext = document.getElementById('nav-next');
const indicator = document.getElementById('page-indicator');

function renderSpread(index) {
  const s = spreads[index];
  leftContent.innerHTML = s.left;
  flipFront.innerHTML = s.right;
  document.getElementById('pages-stack-content').innerHTML =
    (index + 1 < TOTAL_SPREADS) ? spreads[index + 1].right : '';
  flipBack.innerHTML = (index + 1 < TOTAL_SPREADS) ? spreads[index + 1].left : END_PAGE;
  updateNav();
  updateIndicator();
}

function updateNav() {
  navPrev.classList.toggle('hidden', currentSpread <= 0);
  navNext.classList.toggle('hidden', currentSpread >= TOTAL_SPREADS - 1);
}

function updateIndicator() {
  if (!isOpen) {
    indicator.style.display = 'none';
    return;
  }
  indicator.style.display = 'block';
  indicator.textContent = 'Pages ' + (currentSpread * 2 + 2) + '-' + (currentSpread * 2 + 3) + ' / ' + (TOTAL_SPREADS * 2 + 1);
}

function openBook() {
  if (isOpen || isAnimating) return;
  isAnimating = true;

  leftContent.innerHTML = spreads[0].left;
  flipFront.innerHTML = spreads[0].right;
  document.getElementById('pages-stack-content').innerHTML = (1 < spreads.length) ? spreads[1].right : '';
  flipBack.innerHTML = (1 < spreads.length) ? spreads[1].left : '';

  document.getElementById('cover-back-content').innerHTML = spreads[0].left;
  document.getElementById('left-page').style.display = 'none';
  document.getElementById('pages-stack').style.display = 'none';
  flipContainer.style.display = 'none';

  cover.querySelector('.cover-click-hint').style.display = 'none';
  cover.classList.add('opening');

  setTimeout(function() {
    const leftPage = document.getElementById('left-page');
    const stack = document.getElementById('pages-stack');
    leftPage.style.display = 'block';
    stack.style.display = 'block';
    flipContainer.style.display = 'block';
    cover.classList.remove('opening');
    cover.classList.add('opened');
    cover.style.display = 'none';
    stack.classList.add('revealing');
    flipContainer.classList.add('revealing');
    setTimeout(function() {
      stack.classList.remove('revealing');
      flipContainer.classList.remove('revealing');
    }, 460);
    isOpen = true;
    isAnimating = false;
    currentSpread = 0;
    updateNav();
    navPrev.classList.add('hidden');
    navNext.classList.remove('hidden');
    updateIndicator();
  }, 1350);
}

const END_PAGE = "<div class='page-content' style='display:flex;align-items:center;justify-content:center;height:100%;'><div style='font-family:\"IM Fell English SC\",serif;font-size:13px;color:#9A7A50;letter-spacing:3px;text-align:center;'>Fin du livre</div></div>";

function doFlip(direction) {
  if (!isOpen || isAnimating) return;
  if (direction === 'next' && currentSpread >= TOTAL_SPREADS - 1) return;
  if (direction === 'prev' && currentSpread <= 0) return;

  isAnimating = true;
  navPrev.classList.add('hidden');
  navNext.classList.add('hidden');
  flipContainer.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';

  if (direction === 'next') {
    flipFront.innerHTML = spreads[currentSpread].right;
    flipBack.innerHTML = (currentSpread + 1 < TOTAL_SPREADS) ? spreads[currentSpread + 1].left : END_PAGE;
    document.getElementById('pages-stack-content').innerHTML =
      (currentSpread + 1 < TOTAL_SPREADS) ? spreads[currentSpread + 1].right : '';
    flipContainer.style.transform = 'rotateY(-180deg)';
    setTimeout(function() {
      currentSpread++;
      flipContainer.style.transition = 'none';
      flipContainer.style.transform = 'rotateY(0deg)';
      renderSpread(currentSpread);
      isAnimating = false;
    }, 920);
  } else {
    document.getElementById('pages-stack-content').innerHTML = spreads[currentSpread].right;
    leftContent.innerHTML = spreads[currentSpread - 1].left;
    flipFront.innerHTML = spreads[currentSpread].left;
    flipBack.innerHTML = spreads[currentSpread - 1].right;
    flipContainer.style.transition = 'none';
    flipContainer.style.left = 'auto';
    flipContainer.style.right = '50%';
    flipContainer.style.transformOrigin = 'right center';
    flipContainer.style.transform = 'rotateY(0deg)';
    void flipContainer.offsetWidth;
    flipContainer.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';
    requestAnimationFrame(function() {
      flipContainer.style.transform = 'rotateY(180deg)';
    });
    setTimeout(function() {
      currentSpread--;
      flipContainer.style.transition = 'none';
      flipContainer.style.left = '50%';
      flipContainer.style.right = 'auto';
      flipContainer.style.transformOrigin = 'left center';
      flipContainer.style.transform = 'rotateY(0deg)';
      renderSpread(currentSpread);
      isAnimating = false;
    }, 920);
  }
}

function flipNext() { doFlip('next'); }
function flipPrev() { doFlip('prev'); }

cover.addEventListener('click', openBook);

document.addEventListener('keydown', function(e) {
  if (!isOpen) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipNext();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') flipPrev();
});

flipFront.innerHTML = '';
flipBack.innerHTML = '';
leftContent.innerHTML = '';
</script>
</body>
</html>
